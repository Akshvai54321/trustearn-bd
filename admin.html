<body>
  <header>

  <main>
    <div class="card">
      <h3>Admin Login</h3>
      <input type="email" id="email" placeholder="Admin Email">
      <input type="password" id="password" placeholder="Password">
      <button onclick="login()">Login</button>
      <p id="message" class="status">প্রথমে Admin Login করুন।</p>
    </div>

    <div class="card" id="dashboard" hidden>
      <h3>Admin Dashboard</h3>
      <p>আপনি Admin হিসেবে লগইন করেছেন।</p>
      <button onclick="logout()">Logout</button>
    </div>
  </main>

  <script type="module">
    import { createClient } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = const 
    const SUPABASE_ANON_KEY = const SUPABASE_ANON_KEY = '_Publishable_Key';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    window.login = async function () {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const message = document.getElementById('message');

      message.textContent = 'যাচাই হচ্ছে...';

      const { data, error } = await supabase.auth.signInWithPassword({
        email, password
      });

      if (error) {
        message.textContent = 'Login হয়নি: ' + error.message;
        return;
      }

      const { data: isAdmin, error: adminError } =
        await supabase.rpc('is_admin');

      if (adminError || !isAdmin) {
        await supabase.auth.signOut();
        message.textContent = 'আপনার Admin অনুমতি নেই।';
        return;
      }

      document.getElementById('dashboard').hidden = false;
      message.textContent = 'Admin Login সফল হয়েছে।';
    };

    window.logout = async function () {
      await supabase.auth.signOut();
      document.getElementById('dashboard').hidden = true;
      document.getElementById('message').textContent = 'Logout হয়েছে।';
    };
  </script>
</body>
</html>
